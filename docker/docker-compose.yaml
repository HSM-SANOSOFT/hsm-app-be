name: hsm-app

networks:
  hsm-app-network:
    name: hsm-app-network
    driver: bridge

volumes:
  db_postgres_data:
    name: hsm-app-db_postgres-data
  db_redis_data:
    name: hsm-app-db_redis-data
  db_rustfs_data:
    name: hsm-app-db_rustfs-data
  db_meili_data:
    name: hsm-app-db_meili-data

# Local dev keeps using `dotnet run`/`dotnet watch` inside the dev container
# for Hsm.Api/Hsm.Web/Hsm.Worker (fast rebuilds) — they are deliberately left
# out of the devcontainer's runServices (.devcontainer/devcontainer.json).
# The hsm-app-api/hsm-app-web/hsm-app-worker services below build the three
# published images (docker/{api,web,worker}.Dockerfile) for production-shaped
# runs: verifying the container images themselves, and any environment where
# `dotnet run` isn't the deployment shape.
services:
  postgres:
    image: postgres:18-bookworm
    networks:
      - hsm-app-network
    ports:
      - 10004:5432
    volumes:
      - db_postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hsm
    restart: unless-stopped

  # PHI note (rewrite plan follow-up, CF26): the durable job queue (Redis
  # Streams, plan U14/U19) dead-letters failed jobs into a stream that
  # includes the original render payload — which for docs/coms jobs can carry
  # patient data — and nothing here sets a TTL or eviction policy on it. That
  # retention gap is a deliberate ops follow-up, not solved by this compose
  # file: do not build cleanup tooling here, track it as a data-retention
  # decision instead.
  redis:
    image: redis:8-bookworm
    networks:
      - hsm-app-network
    ports:
      - 10005:6379
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/users.acl:/usr/local/etc/redis/users.acl:ro
      - db_redis_data:/data
    environment:
      REDIS_USER: redis
      REDIS_PASSWORD: redis
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    restart: unless-stopped

  # RustFS — S3-compatible object storage (replaces MinIO, which is no longer
  # free). The app talks to it via the standard S3 SDK; only the backing
  # service and credentials change.
  rustfs:
    image: rustfs/rustfs:latest
    networks:
      - hsm-app-network
    ports:
      - 10006:9000
      - 10007:9001
    environment:
      RUSTFS_ACCESS_KEY: rustfs_user
      RUSTFS_SECRET_KEY: rustfs_password
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    volumes:
      - db_rustfs_data:/data
    restart: unless-stopped

  # Meilisearch — search engine for non-clinical collections (rewrite plan U9).
  meilisearch:
    image: getmeili/meilisearch:v1.15
    networks:
      - hsm-app-network
    ports:
      - 10008:7700
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: meili_dev_master_key_please_rotate
    volumes:
      - db_meili_data:/meili_data
    restart: unless-stopped

  # OpenTelemetry collector — OTLP sink for traces/metrics/logs (rewrite plan
  # U10). Telemetry export is never a boot dependency: the app must start and
  # serve with this service stopped.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    networks:
      - hsm-app-network
    ports:
      - 10009:4317
      - 10010:4318
    volumes:
      - ./otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  # --- Application hosts (plan U17: three independently deployable hosts,
  # one core) -------------------------------------------------------------
  #
  # All three read config from ../secrets.env via env_file — nothing is
  # duplicated into `environment:` blocks here, which is also what keeps
  # hsm-app-api and hsm-app-web's Auth cookie posture (Auth__CookieSecure,
  # Auth__CookieDomain) IDENTICAL by construction (rewrite plan follow-up,
  # CF20): one shared cookie policy (Hsm.Contracts.Auth.AuthCookiePolicy)
  # signs both doors in, so a divergent Secure/Domain setting between them
  # would make a cookie one host issues silently fail validation on the
  # other. See secrets.env.template for the full key set (double-underscore
  # ASP.NET Core configuration binding, e.g. ConnectionStrings__HsmDb),
  # values pointed at THIS network's service names (postgres, redis, rustfs,
  # meilisearch, otel-collector) — never the dev-container-published
  # localhost ports.

  hsm-app-api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    networks:
      - hsm-app-network
    ports:
      - 5001:8080
    env_file:
      - ../secrets.env
    depends_on:
      - postgres
      - redis
      - rustfs
      - meilisearch
      - otel-collector
    restart: unless-stopped

  hsm-app-web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    networks:
      - hsm-app-network
    ports:
      - 5000:8080
    env_file:
      - ../secrets.env
    depends_on:
      - postgres
      - redis
      - rustfs
      - meilisearch
      - otel-collector
    restart: unless-stopped

  # No ports: this host answers no requests (see docker/worker.Dockerfile).
  hsm-app-worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    networks:
      - hsm-app-network
    env_file:
      - ../secrets.env
    depends_on:
      - postgres
      - redis
      - rustfs
      - meilisearch
      - otel-collector
    restart: unless-stopped
