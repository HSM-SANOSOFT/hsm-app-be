name: hsm-app

networks:
  hsm-app-network:
    name: hsm-app-network
    driver: bridge

volumes:
  db_postgres_data:
    name: hsm-app-db_postgres-data
  db_redis_data:
    name: hsm-app-db_redis-data
  db_rustfs_data:
    name: hsm-app-db_rustfs-data
  db_meili_data:
    name: hsm-app-db_meili-data

# Application hosts (Hsm.Web, Hsm.Worker) run directly in the dev container via
# `dotnet run`/`dotnet watch`, not as compose services. Only infrastructure
# lives here.
services:
  postgres:
    image: postgres:18-bookworm
    networks:
      - hsm-app-network
    ports:
      - 10004:5432
    volumes:
      - db_postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hsm
    restart: unless-stopped

  redis:
    image: redis:8-bookworm
    networks:
      - hsm-app-network
    ports:
      - 10005:6379
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/users.acl:/usr/local/etc/redis/users.acl:ro
      - db_redis_data:/data
    environment:
      REDIS_USER: redis
      REDIS_PASSWORD: redis
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    restart: unless-stopped

  # RustFS — S3-compatible object storage (replaces MinIO, which is no longer
  # free). The app talks to it via the standard S3 SDK; only the backing
  # service and credentials change.
  rustfs:
    image: rustfs/rustfs:latest
    networks:
      - hsm-app-network
    ports:
      - 10006:9000
      - 10007:9001
    environment:
      RUSTFS_ACCESS_KEY: rustfs_user
      RUSTFS_SECRET_KEY: rustfs_password
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    volumes:
      - db_rustfs_data:/data
    restart: unless-stopped

  # Meilisearch — search engine for non-clinical collections (rewrite plan U9).
  meilisearch:
    image: getmeili/meilisearch:v1.15
    networks:
      - hsm-app-network
    ports:
      - 10008:7700
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: meili_dev_master_key_please_rotate
    volumes:
      - db_meili_data:/meili_data
    restart: unless-stopped

  # OpenTelemetry collector — OTLP sink for traces/metrics/logs (rewrite plan
  # U10). Telemetry export is never a boot dependency: the app must start and
  # serve with this service stopped.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    networks:
      - hsm-app-network
    ports:
      - 10009:4317
      - 10010:4318
    volumes:
      - ./otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped
