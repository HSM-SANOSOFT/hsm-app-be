services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    volumes:
      - ..:/workspace:cached
    # Publish the app to the host. `devcontainer.json` forwardPorts only works
    # under VS Code; this repo is driven by the devcontainer CLI (no VS Code),
    # so the port is published here. Single application host (Blazor Server +
    # REST) on 5000.
    ports:
      - "5000:5000"
    networks:
      - hsm-app-network
    env_file:
      - ../.env
    command: sleep infinity
