name: Build and Push Base Image

# Inert since the .NET retarget: the Node/Oracle base image this built is gone
# and docker/dockerFile.base no longer exists, so the path trigger never fires.
# Retained as the slot for a future .NET base image if one becomes necessary;
# the official mcr.microsoft.com/dotnet images make that unlikely.

on:
  push:
    branches:
      - main
    paths:
      - docker/dockerFile.base
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{vars.REGISTRY}}
          username: ${{secrets.GHCR_USERNAME}}
          password: ${{secrets.GHCR_PASSWORD}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/dockerFile.base
          push: true
          tags: ${{vars.REGISTRY}}/${{vars.IMAGE_OWNER}}/hsm-app-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
