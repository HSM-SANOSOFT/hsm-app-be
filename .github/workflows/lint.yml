name: Lint

on:
  workflow_call: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify formatting and analyzers
        run: |
          if [ ! -f Hsm.sln ]; then
            echo "No Hsm.sln yet (pre-U7) — lint trivially green."
            exit 0
          fi
          dotnet format Hsm.sln --verify-no-changes
