name: PR Validation

# Required check for every PR into a protected branch (development, release/*, main).
# Enforces the release-train rules from
# docs/brainstorms/2026-07-02-legacy-oracle-coexistence-requirements.md §6–7.
#
# The `pr-gate` job at the bottom is the single status check to mark "required" in
# the branch rulesets — it only succeeds if every upstream job did. Its name is
# referenced by all three rulesets in .github/rulesets/ — do not rename it.
#
# .NET retarget (rewrite plan U4): each build/test job no-ops with success while
# the solution does not exist yet (pre-U7), so `pr-gate` always reports a real
# result instead of a structural failure. The guards disappear naturally once
# Hsm.sln lands.

on:
  pull_request:
    branches:
      - development
      - main
      - 'release/**'
      # Unprotected rewrite anchor — included so intra-rewrite PRs exercise the
      # gate even though no ruleset requires it there (rewrite plan U4).
      - 'rewrite/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # --- policy: main may only be merged from a release/* candidate (§6.3.3) -------
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main <- release/* only
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ]; then
            case "$HEAD" in
              development|release/*|hotfix/*)
                echo "OK: main <- $HEAD" ;;
              *)
                echo "::error::main only accepts PRs from development, release/*, or hotfix/*. Got: $HEAD"
                exit 1 ;;
            esac
          else
            echo "OK: base is $BASE, no source-branch restriction."
          fi

  lint:
    uses: ./.github/workflows/lint.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (warnings as errors via Directory.Build.props)
        run: |
          if [ ! -f Hsm.sln ]; then
            echo "No Hsm.sln yet (pre-U7) — build trivially green."
            exit 0
          fi
          dotnet build Hsm.sln --configuration Release

  # --- unit tests: no live infrastructure (Domain/Application/Architecture) ------
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run unit tests
        run: |
          if [ ! -f Hsm.sln ]; then
            echo "No Hsm.sln yet (pre-U7) — unit tests trivially green."
            exit 0
          fi
          # Contract.Tests.Auth/Users/Settings/Templates/Coms/Docs/Fhir need
          # live Postgres (and, for Docs, RustFS); Health/Routes boot the full
          # host like the other contract suites — they all run in the
          # integration-tests job below.
          dotnet test Hsm.sln --configuration Release \
            --filter "FullyQualifiedName!~Integration&FullyQualifiedName!~Hsm.Contract.Tests.Auth&FullyQualifiedName!~Hsm.Contract.Tests.Users&FullyQualifiedName!~Hsm.Contract.Tests.Settings&FullyQualifiedName!~Hsm.Contract.Tests.Templates&FullyQualifiedName!~Hsm.Contract.Tests.Coms&FullyQualifiedName!~Hsm.Contract.Tests.Docs&FullyQualifiedName!~Hsm.Contract.Tests.Fhir&FullyQualifiedName!~Hsm.Contract.Tests.Health&FullyQualifiedName!~Hsm.Contract.Tests.Routes"

  # --- integration tests: real Postgres/Redis/RustFS, same shape as local dev ----
  # Mocks cannot prove EF Core change tracking, migration correctness, or S3
  # compatibility — this job runs against the real services. Meilisearch and the
  # OTLP collector join once U9/U10 introduce dependencies on them.
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hsm
          POSTGRES_PASSWORD: hsm
          POSTGRES_DB: hsm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hsm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__HsmDb: Host=localhost;Port=5432;Username=hsm;Password=hsm;Database=hsm_test
      Redis__ConnectionString: localhost:6379,user=redis,password=redis
      Storage__S3__Endpoint: http://localhost:9000
      Storage__S3__AccessKey: rustfs_user
      Storage__S3__SecretKey: rustfs_password
      Storage__S3__ForcePathStyle: 'true'
      Search__Meilisearch__Url: http://localhost:7700
      Search__Meilisearch__ApiKey: meili_ci_master_key_not_a_secret
    steps:
      - uses: actions/checkout@v4
      # Redis and RustFS run as plain `docker run` containers (not `services:`) so
      # we can mount Redis's repo ACL/config and give RustFS a writable data
      # volume — neither is expressible with the `services:` block. Config mirrors
      # docker/docker-compose.yaml so CI auth matches dev exactly.
      - name: Start Redis (repo ACL — user "redis")
        run: |
          docker run -d --name redis -p 6379:6379 \
            -v "$PWD/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro" \
            -v "$PWD/docker/redis/users.acl:/usr/local/etc/redis/users.acl:ro" \
            redis:8-bookworm redis-server /usr/local/etc/redis/redis.conf
      - name: Start RustFS (S3-compatible)
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=rustfs_user \
            -e RUSTFS_SECRET_KEY=rustfs_password \
            -e RUSTFS_VOLUMES=/data \
            -e RUSTFS_ADDRESS=0.0.0.0:9000 \
            -v rustfs-data:/data \
            rustfs/rustfs:latest
      - name: Start Meilisearch
        run: |
          docker run -d --name meilisearch -p 7700:7700 \
            -e MEILI_ENV=development \
            -e MEILI_MASTER_KEY=meili_ci_master_key_not_a_secret \
            getmeili/meilisearch:v1.15
      - name: Wait for Redis + RustFS + Meilisearch to be ready
        run: |
          for i in $(seq 1 30); do
            redis_ok=$(docker exec redis redis-cli -u redis://redis:redis@localhost:6379 ping 2>/dev/null || true)
            if [ "$redis_ok" = "PONG" ] \
              && curl -sf http://localhost:9000/health >/dev/null \
              && curl -sf http://localhost:7700/health >/dev/null; then
              echo "Redis + RustFS + Meilisearch ready"; exit 0
            fi
            echo "waiting for infra ($i/30)"; sleep 2
          done
          echo "::error::Redis/RustFS/Meilisearch did not become ready in time"
          docker logs redis || true; docker logs rustfs || true; docker logs meilisearch || true
          exit 1
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run integration tests
        run: |
          if [ ! -f Hsm.sln ]; then
            echo "No Hsm.sln yet (pre-U7) — integration tests trivially green."
            exit 0
          fi
          dotnet test tests/Hsm.Integration.Tests --configuration Release
      - name: Run infra-backed contract tests (auth, dedicated database)
        run: |
          if [ ! -f Hsm.sln ]; then
            echo "No Hsm.sln yet (pre-U7) — contract tests trivially green."
            exit 0
          fi
          dotnet test tests/Hsm.Contract.Tests --configuration Release

  # --- single required status check -> reference this name in the rulesets --------
  pr-gate:
    if: always()
    needs: [branch-policy, lint, build, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Assert all checks passed
        run: |
          results="${{ needs.branch-policy.result }} ${{ needs.lint.result }} ${{ needs.build.result }} ${{ needs.unit-tests.result }} ${{ needs.integration-tests.result }}"
          echo "Upstream results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required check did not pass ($r)."
              exit 1
            fi
          done
          echo "All required checks passed."
